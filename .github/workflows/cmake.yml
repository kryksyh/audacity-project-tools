name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Building ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container || '' }}
    strategy:
      matrix:
        config:
        - os: ubuntu-22.04
          name: linux
          preset: conan-release
        - os: ubuntu-22.04
          name: linux-static
          preset: conan-release
          container: alpine:3.21
          cmake_extra: -DCMAKE_EXE_LINKER_FLAGS=-static
          conan_extra: --build="b2/*"
        - os: ubuntu-24.04-arm
          name: linux-arm64
          preset: conan-release
        - os: macos-latest
          name: macos
          preset: conan-release
        - os: windows-2022
          name: windows
          preset: conan-default
        - os: windows-11-arm
          name: windows-arm64
          preset: conan-default
    steps:
    - name: Install Alpine build tools
      if: matrix.config.container
      run: apk add --no-cache cmake g++ make python3 py3-pip git linux-headers perl bash

    - uses: actions/checkout@v4

    - name: Setup Python
      if: ${{ !matrix.config.container }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Conan
      run: python3 -m pip install --break-system-packages "conan>=2"

    - name: Detect Conan profile
      run: conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-${{ matrix.config.name }}-${{ hashFiles('conanfile.txt') }}
        restore-keys: |
          conan-${{ matrix.config.name }}-

    - name: Install dependencies
      run: conan install . --output-folder=build/${{ env.BUILD_TYPE }} --build=missing ${{ matrix.config.conan_extra }} -s build_type=${{ env.BUILD_TYPE }}

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config.preset }} ${{ matrix.config.cmake_extra }}

    - name: Build
      run: cmake --build build/${{ env.BUILD_TYPE }} --config ${{ env.BUILD_TYPE }}

    - name: Package (arm64)
      if: runner.os == 'macOS'
      working-directory: build/${{ env.BUILD_TYPE }}
      run: cmake --build . --target package --config ${{ env.BUILD_TYPE }}

    - name: Upload artifact (arm64)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: audacity-project-tools-macos-arm64
        path: |
          build/${{ env.BUILD_TYPE }}/packages/*
          !build/${{ env.BUILD_TYPE }}/packages/_CPack_Packages
        if-no-files-found: error

    - name: Install dependencies (x86_64)
      if: runner.os == 'macOS'
      run: conan install . --output-folder=build/x86_64 --build=missing -s build_type=${{ env.BUILD_TYPE }} -s arch=x86_64

    - name: Configure CMake (x86_64)
      if: runner.os == 'macOS'
      run: cmake -S . -B build/x86_64 -DCMAKE_TOOLCHAIN_FILE=build/x86_64/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_OSX_ARCHITECTURES=x86_64

    - name: Build (x86_64)
      if: runner.os == 'macOS'
      run: cmake --build build/x86_64 --config ${{ env.BUILD_TYPE }}

    - name: Package (x86_64)
      if: runner.os == 'macOS'
      working-directory: build/x86_64
      run: cmake --build . --target package --config ${{ env.BUILD_TYPE }}

    - name: Upload artifact (x86_64)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: audacity-project-tools-macos-x86_64
        path: |
          build/x86_64/packages/*
          !build/x86_64/packages/_CPack_Packages
        if-no-files-found: error

    - name: Create universal binaries
      if: runner.os == 'macOS'
      run: |
        for bin in build/${{ env.BUILD_TYPE }}/bin/*; do
          [ -f "$bin" ] || continue
          name=$(basename "$bin")
          lipo -create "$bin" "build/x86_64/bin/$name" -output "$bin.universal"
          mv "$bin.universal" "$bin"
        done

    - name: Package (universal)
      if: runner.os == 'macOS'
      working-directory: build/${{ env.BUILD_TYPE }}
      run: cmake --build . --target package --config ${{ env.BUILD_TYPE }}

    - name: Upload artifact (universal)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: audacity-project-tools-macos-universal
        path: |
          build/${{ env.BUILD_TYPE }}/packages/*
          !build/${{ env.BUILD_TYPE }}/packages/_CPack_Packages
        if-no-files-found: error

    - name: Package
      if: runner.os != 'macOS'
      working-directory: build/${{ env.BUILD_TYPE }}
      run: cmake --build . --target package --config ${{ env.BUILD_TYPE }}

    - name: Upload artifact
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: audacity-project-tools-${{ matrix.config.name }}
        path: |
          build/${{ env.BUILD_TYPE }}/packages/*
          !build/${{ env.BUILD_TYPE }}/packages/_CPack_Packages
        if-no-files-found: error
